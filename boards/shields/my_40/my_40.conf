# Enable BLE Support
CONFIG_ZMK_BLE=y

# Keyboard Device Name in Bluetooth Scans
CONFIG_ZMK_KEYBOARD_NAME="my_40"

# Boost Radio Transmission Power to Maximum (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Windows BLE Connection Stability Flags
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n

# Enable ZMK Studio Support
CONFIG_ZMK_STUDIO=y